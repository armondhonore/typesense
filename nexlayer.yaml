application:
  name: typesense
  pods:
  - name: app
    image: typesense/typesense:latest
    path: /
    servicePorts:
    - 8108
    vars:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: "a1b2c3d4e5f6a1b2c3d4"
    volumes:
    - name: typesense-data
      mountPath: /data
      size: 10Gi
