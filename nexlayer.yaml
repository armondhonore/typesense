application:
  name: typesense
  pods:
  - name: app
    image: mirror.gcr.io/typesense/typesense:29.0
    path: /health
    servicePorts:
    - 8108
    vars:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: "a1b2c3d4e5f6a1b2c3d4"
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
    - name: typesense-data
      mountPath: /data
      size: 10Gi
